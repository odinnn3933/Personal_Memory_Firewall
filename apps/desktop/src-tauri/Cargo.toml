[package]
name = "personal-memory-firewall"
version = "0.1.0"
description = "Desktop capture shell for Personal Memory Firewall"
authors = ["Memory Gateway Contributors"]
edition = "2021"

[lib]
name = "personal_memory_firewall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

