services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/memorypassword
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p memorypassword 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    build: .
    environment:
      MEMORY_GATEWAY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory_gateway
      MEMORY_GATEWAY_ADMIN_KEY: admin-demo-key
      MEMORY_GATEWAY_BACKEND_KEY: backend-demo-key
      MEMORY_GATEWAY_GUEST_KEY: guest-demo-key
      MEMORY_GATEWAY_GRAPH_ENABLED: "true"
      MEMORY_GATEWAY_NEO4J_URI: bolt://neo4j:7687
      MEMORY_GATEWAY_NEO4J_USER: neo4j
      MEMORY_GATEWAY_NEO4J_PASSWORD: memorypassword
      MEMORY_GATEWAY_NEO4J_DATABASE: neo4j
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["python", "-m", "memory_gateway.api.main"]
